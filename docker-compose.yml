version: '3.8'
services:
  grpc-server:
    image: python:3.10-slim
    volumes:
      - .:/app
    working_dir: /app
    command: bash -c "pip install grpcio grpcio-tools && python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. hazard.proto && python server.py"
    ports:
      - "50051:50051"

  gateway:
    image: python:3.10-slim
    volumes:
      - .:/app
    working_dir: /app
    command: bash -c "pip install grpcio grpcio-tools spyne lxml && python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. hazard.proto && python gateway.py"
    ports:
      - "8000:8000"
    depends_on:
      - grpc-server

  client:
    image: python:3.10-slim
    volumes:
      - .:/app
    working_dir: /app
    command: bash -c "pip install zeep && python client.py"
    depends_on:
      - gateway

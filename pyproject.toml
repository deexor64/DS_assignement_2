[project]
name = "DS_assignement_2"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "deexor64",email = "191124667+deexor64@users.noreply.github.com"},
]
dependencies = ["grpcio>=1.84.0", "grpcio-tools>=1.84.0", "spyne>=2.14.0", "lxml>=6.1.3", "zeep>=4.3.3", "six>=1.17.0"]
requires-python = "==3.10.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[tool.pdm.scripts]
generate_proto = "python3 -m grpc_tools.protoc -I. --python_out=src --grpc_python_out=src hazard/hazard.proto"
server = "python3 src/server.py"
gateway = "python3 src/gateway.py"
client = "python3 src/client.py"
